name: Build My Installer
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Pake
        run: npm install -g pake-cli

      - name: Build Installer
        # CHANGE THE URL AND NAME BELOW TO MATCH YOUR APP
        run: pake https://example.com --name "MyCustomApp" --targets msi

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "*.msi"
