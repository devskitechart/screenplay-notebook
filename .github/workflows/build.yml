name: Build Screenplay Notebook Installer
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Rust (Required for Pake)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pake
        run: npm install -g pake-cli

      - name: Build Local Free Windows Installer
        # Points directly to your index.html and icon.ico files out in the open
        run: pake ./index.html --name "Screenplay Notebook" --icon icon.ico --targets msi

      - name: Upload Installer File
        uses: actions/upload-artifact@v4
        with:
          name: Screenplay-Notebook-Local-Installer
          path: "*.msi"
