name: Build Screenplay Notebook Installer
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Pake
        run: npm install -g pake-cli

      - name: Build Free Windows Installer
        run: pake https://classy-kangaroo-93af16.netlify.app/ --name "Screenplay Notebook" --author "Devski" --targets msi

      - name: Upload Installer File
        uses: actions/upload-artifact@v4
        with:
          name: Screenplay-Notebook-Installer
          path: "*.msi"
